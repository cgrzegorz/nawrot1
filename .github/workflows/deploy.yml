# Build statyczny Next.js -> GitHub Pages (https://cgrzegorz.github.io/nawrot1/)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Jedno wdrożenie naraz; nie przerywamy trwającego.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BASE_PATH: /nawrot1
      NEXT_PUBLIC_SITE_URL: https://cgrzegorz.github.io
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `prebuild` generuje warianty WebP z `assets/` do `public/img/`.
      - run: npm run build

      # Bez tego GitHub Pages pomija katalog `_next/` (Jekyll ignoruje `_*`).
      - run: touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
