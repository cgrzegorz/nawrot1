# Build statyczny Next.js -> gałąź `gh-pages`, którą serwuje GitHub Pages
# (Settings -> Pages -> Source: Deploy from a branch -> gh-pages / (root)).
# Adres: https://cgrzegorz.github.io/nawrot1/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Zapis potrzebny, bo workflow sam wypycha commit na `gh-pages`.
permissions:
  contents: write

# Jedno wdrożenie naraz; nie przerywamy trwającego.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BASE_PATH: /nawrot1
      NEXT_PUBLIC_SITE_URL: https://cgrzegorz.github.io
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `prebuild` generuje warianty WebP z `assets/` do `public/img/`.
      - run: npm run build

      # Bez tego GitHub Pages pomija katalog `_next/` (Jekyll ignoruje `_*`).
      - run: touch out/.nojekyll

      # Świeże repo w `out/` i force-push: gałąź `gh-pages` ma zawsze
      # dokładnie jeden commit, więc historia nie puchnie od obrazków.
      - name: Publikacja na gałęzi gh-pages
        working-directory: out
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
